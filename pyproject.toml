[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wassreg"
version = "0.1.0"
description = "Wasserstein-2 regression with PyTorch: Bezier/B-spline curve and surface fitting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Matthew Ivanov", email = "mivanov@itmo.ru"},
    {name = "Maksim Maslov", email = "mimaslov@itmo.ru"}
]
maintainers = [
    {name = "Matthew Ivanov", email = "mivanov@itmo.ru"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wassreg"]

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wassreg"]

[tool.ruff.format]
quote-style = "double"
